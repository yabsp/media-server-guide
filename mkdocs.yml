site_name: Media Server Guide
site_author: Yanick Spichty

theme:
  name: material
  palette:
    scheme: slate # Gives it a sleek, dark terminal aesthetic
    primary: blue grey
    accent: light blue
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy # Adds a "copy" button to your terminal commands!

plugins:
  # `search` must be listed explicitly once a plugins block exists,
  # otherwise the default search plugin is disabled.
  - search
  - i18n:
      docs_structure: suffix          # English = base files, German = *.de.md siblings
      fallback_to_default: true        # missing DE page falls back to EN
      reconfigure_material: true       # adds the language switcher to the top bar
      reconfigure_search: true         # separate search index per language
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: de
          name: Deutsch (Schweiz)
          build: true
          nav_translations:
            Home: Startseite
            System Setup: Systemeinrichtung
            Debian Installation: Debian-Installation
            User & Network: Benutzer & Netzwerk
            Storage (MergerFS): Speicher (MergerFS)
            Energy Optimization: Energieoptimierung
            Containers & Routing: Container & Routing
            Docker & Services: Docker & Dienste
            VPS Gateway: VPS-Gateway
            Maintenance: Wartung
            Backups: Datensicherung
            Resources: Ressourcen
            Cost Analysis: Kostenanalyse
            Further Links & Related Guides: Weiterführende Links & verwandte Anleitungen

markdown_extensions:
  - tables
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences

nav:
  - Home: index.md
  - System Setup:
      - Debian Installation: 01-debian.md
      - User & Network: 02-network.md
      - Storage (MergerFS): 03-storage.md
      - Energy Optimization: 06-energy.md
  - Containers & Routing:
      - Docker & Services: 04-docker.md
      - VPS Gateway: 05-vps.md
  - Maintenance:
      - Backups: 07-backups.md
  - Resources:
      - Cost Analysis: 08-costs.md
      - Further Links & Related Guides: 09-further-reading.md

